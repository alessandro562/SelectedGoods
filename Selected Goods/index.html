  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\"color:#5E6E82\">FAQ<\u002Fa>\n      <a href=\"it/\" hreflang=\"it\" style=\"color:#5E6E82;font-size:13px;letter-spacing:0.08em;font-weight:500\" style-hover=\"color:#1A1F2B\">IT<\u002Fa>\n      <a href=\"#submit\" style=\"background:#1A1F2B;color:#F6F5F1;padding:11px 18px;font-weight:500;white-space:nowrap;transition:background 0.2s\" style-hover=\"background:#5E6E82;color:#F6F5F1\">Send your demo<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fnav>\n<header id=\"top\" data-screen-label=\"Hero\" style=\"position:relative;overflow:hidden;background:#F6F5F1\">\n  <div style=\"position:absolute;top:0;bottom:0;right:0;width:min(58%,820px);pointer-events:none\">{{ heroArt }}<\u002Fdiv>\n  <div style=\"position:relative;max-width:1360px;margin:0 auto;padding:clamp(88px,12vw,184px) clamp(20px,4vw,48px) clamp(80px,10vw,152px);display:flex;flex-direction:column;gap:36px\">\n    <div style=\"display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:#5E6E82\"><span style=\"width:8px;height:8px;border-radius:50%;background:#7C9A7E\"><\u002Fspan>Now taking on new artists<\u002Fdiv>\n    <h1 style=\"margin:0;font-size:clamp(60px,10vw,168px);font-weight:600;letter-spacing:-0.055em;line-height:0.88\">We co‑create<br>your music.<\u002Fh1>\n    <p style=\"margin:0;font-size:clamp(19px,1.7vw,23px);line-height:1.5;max-width:580px;text-wrap:pretty\">You have the ideas. We help you finish them. A small studio of producers and engineers working side by side with house and tech house artists, from the first loop to the master your label releases.<\u002Fp>\n    <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n      <a href=\"#submit\" style=\"background:#1A1F2B;color:#F6F5F1;padding:18px 28px;font-size:17px;font-weight:500;display:flex;align-items:center;gap:12px;transition:background 0.2s\" style-hover=\"background:#5E6E82;color:#F6F5F1\">Send us your demo <span>→<\u002Fspan><\u002Fa>\n      <a href=\"#process\" style=\"border:1px solid #1A1F2B;background:#F6F5F1;color:#1A1F2B;padding:17px 28px;font-size:17px;font-weight:500;transition:background 0.2s\" style-hover=\"background:#DCE6F2;color:#1A1F2B\">See how we work<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n<section data-screen-label=\"Manifesto\" style=\"background:#F6F5F1;padding:0 clamp(20px,4vw,48px) clamp(80px,10vw,144px)\">\n  <div style=\"max-width:1360px;margin:0 auto;border-top:1px solid #1A1F2B;padding-top:clamp(40px,5vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:32px 64px\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:#5E6E82\">Why we exist<\u002Fdiv>\n    <p style=\"grid-column:span 2;margin:0;font-size:clamp(28px,3.4vw,46px);font-weight:500;letter-spacing:-0.035em;line-height:1.15;text-wrap:pretty\">Every artist has a track in their head that doesn’t quite reach the speakers. <span style=\"color:#5E6E82\">The groove is there, the idea is there, but something is missing. We’re the other half. We sit next to you, listen closely, and build it with you until it sounds the way you always heard it.<\u002Fspan><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"services\" data-screen-label=\"Services\" style=\"background:#DCE6F2;padding:clamp(80px,10vw,144px) clamp(20px,4vw,48px)\">\n  <div style=\"max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:56px\">\n    <div style=\"display:flex;flex-direction:column;gap:18px;max-width:760px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:#3A4A5E\">What we do<\u002Fdiv>\n      <h2 style=\"margin:0;font-size:clamp(40px,5.2vw,76px);font-weight:600;letter-spacing:-0.05em;line-height:0.95\">However you need us, we’re there.<\u002Fh2>\n      <p style=\"margin:6px 0 0;font-size:19px;line-height:1.55;max-width:520px;color:#2A3446;text-wrap:pretty\">Some artists want a partner in the studio, others just need the last ten percent. Pick one, or mix them.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;border-bottom:1px solid #1A1F2B\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px 48px;align-items:baseline;padding:36px 24px;margin:0 -24px;border-top:1px solid #1A1F2B;transition:background 0.3s\" style-hover=\"background:#E8EEF5\">\n        <div style=\"display:flex;gap:24px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#3A4A5E;min-width:22px\">01<\u002Fspan><span style=\"font-size:clamp(30px,3.4vw,48px);font-weight:600;letter-spacing:-0.045em;line-height:1\">Co-production<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;padding-left:46px;max-width:560px\">\n          <div style=\"font-size:18px;line-height:1.55;color:#2A3446;text-wrap:pretty\">You bring the idea, we build it with you: arrangement, sound design, groove. Remote sessions or in the room together.<\u002Fdiv>\n          <div style=\"font-size:14px;font-style:italic;color:#5E6E82\">Credited or uncredited<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px 48px;align-items:baseline;padding:36px 24px;margin:0 -24px;border-top:1px solid #1A1F2B;transition:background 0.3s\" style-hover=\"background:#E8EEF5\">\n        <div style=\"display:flex;gap:24px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#3A4A5E;min-width:22px\">02<\u002Fspan><span style=\"font-size:clamp(30px,3.4vw,48px);font-weight:600;letter-spacing:-0.045em;line-height:1\">Artistic direction<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;padding-left:46px;max-width:560px\">\n          <div style=\"font-size:18px;line-height:1.55;color:#2A3446;text-wrap:pretty\">A trusted outside ear on your music: honest feedback, references and a release plan that makes your sound unmistakably yours.<\u002Fdiv>\n          <div style=\"font-size:14px;font-style:italic;color:#5E6E82\">Per release or ongoing<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px 48px;align-items:baseline;padding:36px 24px;margin:0 -24px;border-top:1px solid #1A1F2B;transition:background 0.3s\" style-hover=\"background:#E8EEF5\">\n        <div style=\"display:flex;gap:24px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#3A4A5E;min-width:22px\">03<\u002Fspan><span style=\"font-size:clamp(30px,3.4vw,48px);font-weight:600;letter-spacing:-0.045em;line-height:1\">Ghost production<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;padding-left:46px;max-width:560px\">\n          <div style=\"font-size:18px;line-height:1.55;color:#2A3446;text-wrap:pretty\">Complete tracks shaped around your identity, delivered with full rights. We stay in the background, always.<\u002Fdiv>\n          <div style=\"font-size:14px;font-style:italic;color:#5E6E82\">Under NDA from day one<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px 48px;align-items:baseline;padding:36px 24px;margin:0 -24px;border-top:1px solid #1A1F2B;transition:background 0.3s\" style-hover=\"background:#E8EEF5\">\n        <div style=\"display:flex;gap:24px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#3A4A5E;min-width:22px\">04<\u002Fspan><span style=\"font-size:clamp(30px,3.4vw,48px);font-weight:600;letter-spacing:-0.045em;line-height:1\">Mixing &amp; Mastering<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;padding-left:46px;max-width:560px\">\n          <div style=\"font-size:18px;line-height:1.55;color:#2A3446;text-wrap:pretty\">Weight in the low end, air on top, and loudness that holds up everywhere, from earbuds to a festival rig.<\u002Fdiv>\n          <div style=\"font-size:14px;font-style:italic;color:#5E6E82\">Stems &amp; club version included<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<section id=\"process\" data-screen-label=\"Process\" style=\"background:#1A1F2B;color:#F6F5F1;padding:clamp(80px,10vw,144px) clamp(20px,4vw,48px)\">\n  <div style=\"max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:72px\">\n    <div style=\"display:flex;flex-direction:column;gap:18px;max-width:760px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:#9AA6B6\">How it works<\u002Fdiv>\n      <h2 style=\"margin:0;font-size:clamp(40px,5.2vw,76px);font-weight:600;letter-spacing:-0.05em;line-height:0.95\">Two halves, coming together.<\u002Fh2>\n      <p style=\"margin:6px 0 0;font-size:19px;line-height:1.55;max-width:520px;color:#DCE6F2;text-wrap:pretty\">One point of contact, clear timelines, and nothing leaves the studio until you’re proud to play it out.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:48px 32px\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <svg sc-camel-view-box=\"-40 -40 180 180\" width=\"96\" height=\"96\" fill=\"#F6F5F1\"><path d=\"M0,0 H62 V34 H34 V100 H0 Z\" transform=\"translate(-30 -30)\"><\u002Fpath><path d=\"M100,100 H38 V66 H66 V0 H100 Z\" transform=\"translate(30 30)\" fill=\"#5E6E82\"><\u002Fpath><\u002Fsvg>\n        <div style=\"height:1px;background:#3A4252\"><\u002Fdiv>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9AA6B6\">01<\u002Fspan>\n        <div style=\"font-size:26px;font-weight:600;letter-spacing:-0.035em;line-height:1.1\">Send us what you’ve got.<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.6;color:#C9D2DE;text-wrap:pretty\">A private link and a few words on where you want to take it. Rough is fine.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <svg sc-camel-view-box=\"-40 -40 180 180\" width=\"96\" height=\"96\" fill=\"#F6F5F1\"><path d=\"M0,0 H62 V34 H34 V100 H0 Z\" transform=\"translate(-16 -16)\"><\u002Fpath><path d=\"M100,100 H38 V66 H66 V0 H100 Z\" transform=\"translate(16 16)\" fill=\"#7F8FA3\"><\u002Fpath><\u002Fsvg>\n        <div style=\"height:1px;background:#3A4252\"><\u002Fdiv>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9AA6B6\">02<\u002Fspan>\n        <div style=\"font-size:26px;font-weight:600;letter-spacing:-0.035em;line-height:1.1\">We listen, properly.<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.6;color:#C9D2DE;text-wrap:pretty\">If it’s a fit, you get a clear proposal: scope, timeline and price. No obligation.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <svg sc-camel-view-box=\"-40 -40 180 180\" width=\"96\" height=\"96\" fill=\"#F6F5F1\"><path d=\"M0,0 H62 V34 H34 V100 H0 Z\" transform=\"translate(-6 -6)\"><\u002Fpath><path d=\"M100,100 H38 V66 H66 V0 H100 Z\" transform=\"translate(6 6)\" fill=\"#AEBBCB\"><\u002Fpath><\u002Fsvg>\n        <div style=\"height:1px;background:#3A4252\"><\u002Fdiv>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9AA6B6\">03<\u002Fspan>\n        <div style=\"font-size:26px;font-weight:600;letter-spacing:-0.035em;line-height:1.1\">We build it together.<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.6;color:#C9D2DE;text-wrap:pretty\">Sessions and versions shared as we go. You approve every step, nothing happens behind your back.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <svg sc-camel-view-box=\"-40 -40 180 180\" width=\"96\" height=\"96\" fill=\"#F6F5F1\"><path d=\"M0,0 H62 V34 H34 V100 H0 Z\"><\u002Fpath><path d=\"M100,100 H38 V66 H66 V0 H100 Z\"><\u002Fpath><\u002Fsvg>\n        <div style=\"height:1px;background:#F6F5F1\"><\u002Fdiv>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#DCE6F2\">04<\u002Fspan>\n        <div style=\"font-size:26px;font-weight:600;letter-spacing:-0.035em;line-height:1.1\">You release it.<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.6;color:#C9D2DE;text-wrap:pretty\">Master, stems and club version, ready for your label or distributor. Your record, finished.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<section data-screen-label=\"Promise\" style=\"background:#F6F5F1;padding:clamp(80px,10vw,144px) clamp(20px,4vw,48px)\">\n  <div style=\"max-width:1360px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px 88px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:18px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:#5E6E82\">Our promise<\u002Fdiv>\n      <div style=\"font-size:clamp(36px,4.4vw,64px);font-weight:600;letter-spacing:-0.05em;line-height:1;text-wrap:pretty\">You lead. We build alongside. The record stays yours.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column\">\n      <div style=\"display:grid;grid-template-columns:48px minmax(0,1fr);gap:20px;padding:28px 0;border-top:1px solid #1A1F2B\"><span style=\"font-size:clamp(28px,3vw,36px);font-weight:300;color:#5E6E82;line-height:1\">1<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font-size:22px;font-weight:600;letter-spacing:-0.03em\">Your sound comes first<\u002Fdiv><div style=\"font-size:17px;line-height:1.55;color:#3A4252\">We adapt to how you hear music. We’re not here to sell you ours.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:48px minmax(0,1fr);gap:20px;padding:28px 0;border-top:1px solid #1A1F2B\"><span style=\"font-size:clamp(28px,3vw,36px);font-weight:300;color:#5E6E82;line-height:1\">2<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font-size:22px;font-weight:600;letter-spacing:-0.03em\">What happens here, stays here<\u002Fdiv><div style=\"font-size:17px;line-height:1.55;color:#3A4252\">An NDA on every project. Ghost work stays ghost, full stop.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:48px minmax(0,1fr);gap:20px;padding:28px 0;border-top:1px solid #1A1F2B;border-bottom:1px solid #1A1F2B\"><span style=\"font-size:clamp(28px,3vw,36px);font-weight:300;color:#5E6E82;line-height:1\">3<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font-size:22px;font-weight:600;letter-spacing:-0.03em\">Selected, never mass-produced<\u002Fdiv><div style=\"font-size:17px;line-height:1.55;color:#3A4252\">We work with a handful of artists each season, so each one gets our full attention.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<section id=\"faq\" data-screen-label=\"FAQ\" style=\"background:#DCE6F2;padding:clamp(80px,10vw,144px) clamp(20px,4vw,48px)\">\n  <div style=\"max-width:1360px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:40px 88px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:18px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:#3A4A5E\">FAQ<\u002Fdiv>\n      <h2 style=\"margin:0;font-size:clamp(40px,5.2vw,76px);font-weight:600;letter-spacing:-0.05em;line-height:0.95\">Good questions.<\u002Fh2>\n      <p style=\"margin:0;font-size:17px;line-height:1.55;color:#2A3446;max-width:380px\">Something else on your mind? Write to us at <a href=\"mailto:selectedgoodsmusic@gmail.com\" style=\"color:#1A1F2B;text-decoration:underline;text-underline-offset:3px\">selectedgoodsmusic@gmail.com<\u002Fa><\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <sc-for list=\"{{ faq }}\" as=\"f\" hint-placeholder-count=\"5\">\n        <div style=\"background:#F6F5F1\">\n          <button sc-camel-on-click=\"{{ f.toggle }}\" style=\"width:100%;background:none;border:none;padding:24px 26px;display:flex;align-items:center;gap:20px;cursor:pointer;text-align:left;color:#1A1F2B\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5E6E82;min-width:24px\">{{ f.n }}<\u002Fspan>\n            <span style=\"flex:1;font-size:20px;font-weight:500;letter-spacing:-0.025em\">{{ f.q }}<\u002Fspan>\n            <span style=\"font-size:24px;font-weight:300;width:24px;text-align:center\">{{ f.sign }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ f.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:0 60px 28px 70px;font-size:17px;line-height:1.6;color:#3A4252;text-wrap:pretty\">{{ f.a }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<section id=\"submit\" data-screen-label=\"Submit\" style=\"background:#1A1F2B;color:#F6F5F1;padding:clamp(80px,10vw,144px) clamp(20px,4vw,48px);position:relative;overflow:hidden\">\n  <svg width=\"100%\" height=\"100%\" style=\"position:absolute;inset:0;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse 70% 90% at 0% 100%,#000 0%,transparent 75%);mask-image:radial-gradient(ellipse 70% 90% at 0% 100%,#000 0%,transparent 75%)\">\n    <defs><pattern id=\"sgpC\" width=\"84\" height=\"84\" sc-camel-pattern-units=\"userSpaceOnUse\"><g transform=\"translate(12 12) scale(0.6)\" fill=\"#2A3244\"><path d=\"M0,0 H62 V34 H34 V100 H0 Z\"><\u002Fpath><path d=\"M100,100 H38 V66 H66 V0 H100 Z\"><\u002Fpath><\u002Fg><\u002Fpattern><\u002Fdefs>\n    <rect width=\"100%\" height=\"100%\" fill=\"url(#sgpC)\"><\u002Frect>\n  <\u002Fsvg>\n  <div style=\"position:relative;max-width:1360px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:56px 88px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:28px\">\n      <div style=\"display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:#DCE6F2\"><span style=\"width:8px;height:8px;border-radius:50%;background:#9DBB9F\"><\u002Fspan>Now taking on new artists<\u002Fdiv>\n      <h2 style=\"margin:0;font-size:clamp(48px,6.4vw,100px);font-weight:600;letter-spacing:-0.055em;line-height:0.92\">Let’s finish what you started.<\u002Fh2>\n      <p style=\"margin:0;font-size:19px;line-height:1.55;color:#DCE6F2;max-width:480px;text-wrap:pretty\">Send us a private link to your demo. We listen to everything that comes in, and if we feel we can make it better together, we’ll tell you how.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:12px;font-size:16px;color:#C9D2DE\">\n        <div style=\"display:flex;gap:12px;align-items:center\"><svg sc-camel-view-box=\"-10 -10 120 120\" width=\"16\" height=\"16\" fill=\"#DCE6F2\"><path d=\"M0,0 H62 V34 H34 V100 H0 Z\"><\u002Fpath><path d=\"M100,100 H38 V66 H66 V0 H100 Z\"><\u002Fpath><\u002Fsvg>Free to submit, no obligation<\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:center\"><svg sc-camel-view-box=\"-10 -10 120 120\" width=\"16\" height=\"16\" fill=\"#DCE6F2\"><path d=\"M0,0 H62 V34 H34 V100 H0 Z\"><\u002Fpath><path d=\"M100,100 H38 V66 H66 V0 H100 Z\"><\u002Fpath><\u002Fsvg>Your demo is confidential from the moment you send it<\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:center\"><svg sc-camel-view-box=\"-10 -10 120 120\" width=\"16\" height=\"16\" fill=\"#DCE6F2\"><path d=\"M0,0 H62 V34 H34 V100 H0 Z\"><\u002Fpath><path d=\"M100,100 H38 V66 H66 V0 H100 Z\"><\u002Fpath><\u002Fsvg>You keep 100% of your rights<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#F6F5F1;color:#1A1F2B;padding:clamp(28px,4vw,48px);box-shadow:0 40px 80px rgba(0,0,0,0.25)\">\n      <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n        <form sc-camel-on-submit=\"{{ submit }}\" style=\"display:flex;flex-direction:column;gap:22px\">\n          <div style=\"font-size:24px;font-weight:600;letter-spacing:-0.035em\">Tell us about your track<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:22px\">\n            <label style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:14px;font-weight:500\">Artist name<\u002Fspan><input required=\"\" placeholder=\"How you release music\" style=\"border:1px solid #C5CCD6;background:#FFFFFF;padding:14px 14px;font-size:16px;outline:none;color:#1A1F2B\" style-focus=\"border-color:#1A1F2B\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:14px;font-weight:500\">Email<\u002Fspan><input required=\"\" type=\"email\" placeholder=\"you@email.com\" style=\"border:1px solid #C5CCD6;background:#FFFFFF;padding:14px 14px;font-size:16px;outline:none;color:#1A1F2B\" style-focus=\"border-color:#1A1F2B\"><\u002Flabel>\n          <\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:14px;font-weight:500\">Link to your demo<\u002Fspan><input required=\"\" type=\"url\" placeholder=\"Private SoundCloud, Dropbox or Drive link\" style=\"border:1px solid #C5CCD6;background:#FFFFFF;padding:14px 14px;font-size:16px;outline:none;color:#1A1F2B\" style-focus=\"border-color:#1A1F2B\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:14px;font-weight:500\">What are you looking for?<\u002Fspan>\n            <sc-raw-select style=\"border:1px solid #C5CCD6;background:#FFFFFF;padding:14px 12px;font-size:16px;outline:none;color:#1A1F2B;border-radius:0\"><option>Co-production<\u002Foption><option>Artistic direction<\u002Foption><option>Ghost production<\u002Foption><option>Mixing &amp; Mastering<\u002Foption><option>Not sure yet, let’s talk<\u002Foption><\u002Fsc-raw-select>\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:14px;font-weight:500\">Anything we should know? <span style=\"color:#5E6E82;font-weight:400\">(optional)<\u002Fspan><\u002Fspan><textarea rows=\"3\" placeholder=\"References, label, deadline…\" style=\"border:1px solid #C5CCD6;background:#FFFFFF;padding:14px;font-size:16px;outline:none;resize:vertical;color:#1A1F2B\"><\u002Ftextarea><\u002Flabel>\n          <button type=\"submit\" style=\"margin-top:6px;background:#1A1F2B;color:#F6F5F1;border:none;padding:20px 28px;font-size:17px;font-weight:500;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background 0.2s\" style-hover=\"background:#5E6E82\">Send your demo <span>→<\u002Fspan><\u002Fbutton>\n        <\u002Fform>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"min-height:460px;display:flex;flex-direction:column;justify-content:space-between;gap:32px\">\n          <svg sc-camel-view-box=\"-10 -10 120 120\" width=\"64\" height=\"64\" fill=\"#1A1F2B\"><path d=\"M0,0 H62 V34 H34 V100 H0 Z\"><\u002Fpath><path d=\"M100,100 H38 V66 H66 V0 H100 Z\"><\u002Fpath><\u002Fsvg>\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div style=\"font-size:40px;font-weight:600;letter-spacing:-0.05em;line-height:1\">Got it. We’re listening.<\u002Fdiv>\n            <div style=\"font-size:17px;line-height:1.55;color:#5E6E82\">Thanks for trusting us with your music. You’ll hear from us by email.<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ reset }}\" style=\"align-self:flex-start;background:none;border:1px solid #1A1F2B;padding:12px 18px;font-size:15px;cursor:pointer;color:#1A1F2B\">Send another track<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<footer style=\"background:#1A1F2B;color:#F6F5F1;border-top:1px solid #2F3647;padding:40px clamp(20px,4vw,48px)\">\n  <div style=\"max-width:1360px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap\">\n    <div style=\"display:flex;align-items:center;gap:12px\"><svg sc-camel-view-box=\"-10 -10 120 120\" width=\"28\" height=\"28\" fill=\"#F6F5F1\"><path d=\"M0,0 H62 V34 H34 V100 H0 Z\"><\u002Fpath><path d=\"M100,100 H38 V66 H66 V0 H100 Z\"><\u002Fpath><\u002Fsvg><span style=\"font-size:22px;font-weight:600;letter-spacing:-0.05em\">selected goods<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;font-size:15px;flex-wrap:wrap\">\n      <a href=\"mailto:selectedgoodsmusic@gmail.com\" style=\"color:#F6F5F1\" style-hover=\"color:#DCE6F2\">selectedgoodsmusic@gmail.com<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"font-size:14px;color:#9AA6B6\">We co-create your music. © 2026<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst FAQ = [\n  ['Is ghost production really confidential?', 'Completely. We sign an NDA before we hear a single note. You keep 100% of the rights and the credits, and our name never appears unless you want it to.'],\n  ['Who do you usually work with?', 'House and tech house DJs and producers, from artists preparing their first EP to names already touring. We keep the roster small on purpose, so every record gets our full attention.'],\n  ['How does co-production actually work?', 'You bring whatever you have: a loop, a rough demo, a reference track. We work on it together in sessions, remotely or in the studio, sharing versions as we go, until it sounds like you at your best.'],\n  ['What do I get at the end?', 'A release-ready master, the full set of stems and a club version we’ve tested on a proper system. Revisions are part of the process, not an extra.'],\n  ['How much does it cost?', 'It depends on the project, so we quote after we’ve listened. Send your demo and we’ll come back with a clear proposal: scope, timeline and price, with no obligation.']\n];\nclass Component extends DCLogic {\n  state = { hover: false, open: 0, sent: false, sx: 0, sy: 0, son: false };\n  renderVals() {\n    const { hover, open, sent, sx, sy, son } = this.state;\n    return {\n      logo: { g: hover ? 'rotate(180deg)' : 'rotate(0deg)', a: hover ? 'translate(-7px,-7px)' : 'translate(0,0)', b: hover ? 'translate(7px,7px)' : 'translate(0,0)' },\n      logoOn: () => this.setState({ hover: true }),\n      logoOff: () => this.setState({ hover: false }),\n      heroArt: this.heroArt || (this.heroArt = (() => {\n        const e = React.createElement;\n        return e('svg', { viewBox: '-20 -20 140 140', preserveAspectRatio: 'xMidYMid meet', width: '100%', height: '100%', style: { overflow: 'visible', display: 'block' } },\n          e('path', { d: 'M0,0 H62 V34 H34 V100 H0 Z', fill: '#E6ECF3', style: { animation: 'sgA 9s ease-in-out infinite' } }),\n          e('path', { d: 'M100,100 H38 V66 H66 V0 H100 Z', fill: '#DCE6F2', style: { animation: 'sgB 9s ease-in-out infinite' } })\n        );\n      })()),\n      spot: { o: son ? 1 : 0, mask: `radial-gradient(circle 240px at ${sx}px ${sy}px,#000 0%,rgba(0,0,0,0.35) 45%,transparent 100%)` },\n      spotMove: e => { const r = e.currentTarget.getBoundingClientRect(); this.setState({ sx: Math.round(e.clientX - r.left), sy: Math.round(e.clientY - r.top), son: true }); },\n      spotLeave: () => this.setState({ son: false }),\n      faq: FAQ.map(([q, a], i) => ({ q, a, n: String(i + 1).padStart(2, '0'), isOpen: open === i, sign: open === i ? '−' : '+', toggle: () => this.setState({ open: open === i ? -1 : i }) })),\n      sent, notSent: !sent,\n      submit: e => {\n        e.preventDefault();\n        const f = e.target, ins = f.querySelectorAll('input'), sel = f.querySelector('select'), ta = f.querySelector('textarea');\n        const data = { _subject: 'New demo submission — Selected Goods', _template: 'table', _captcha: 'false',\n          artist: ins[0] && ins[0].value, email: ins[1] && ins[1].value, demo_link: ins[2] && ins[2].value,\n          looking_for: sel ? sel.value : '', notes: ta ? ta.value : '' };\n        if (data.email) data._replyto = data.email;\n        this.setState({ sending: true });\n        fetch('https://formsubmit.co/ajax/selectedgoodsmusic@gmail.com', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(data) })\n          .then(r => { if (!r.ok) throw new Error('bad status'); this.setState({ sent: true, sending: false }); })\n          .catch(() => { this.setState({ sending: false }); window.location.href = 'mailto:selectedgoodsmusic@gmail.com?subject=' + encodeURIComponent(data._subject) + '&body=' + encodeURIComponent(Object.entries(data).filter(([k]) => k[0] !== '_').map(([k, v]) => k + ': ' + v).join('\\n')); });\n      },\n      reset: () => this.setState({ sent: false })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
